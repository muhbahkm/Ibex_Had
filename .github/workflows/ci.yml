name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Supabase publishable client configuration. Authorization remains enforced by RLS/RPC.
      EXPO_PUBLIC_SUPABASE_URL: https://asvckwhrzoqupkihqhoj.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_r_4_ggotEHwWFZ6jPWSXRQ_7KYdIEMm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Expo dependency check
        run: pnpm --dir apps/mobile exec expo install --check

      - name: Expo Doctor
        run: cd apps/mobile && npx --yes expo-doctor@latest

      - name: Android bundle smoke test
        run: pnpm --dir apps/mobile exec expo export --platform android --output-dir ../../.artifacts/expo-android
